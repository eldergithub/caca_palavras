<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .letra {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 36px;
        fill: #1E2A38;
        text-anchor: middle;
        dominant-baseline: central;
      }
      /* As letras de enchimento recuam para que as duas palavras se leiam
         mesmo no ícone de 48 px; a tinta das destacadas nunca clareia. */
      .enchimento { opacity: 0.42; }
      .destaque { font-size: 40px; }
    </style>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#D9D4C4" flood-opacity="0.9" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="transparent" />

  <!-- Cartão arredondado -->
  <rect x="36" y="32" width="440" height="440" rx="92" fill="#F8F5EC" stroke="#D9D4C4" stroke-width="2.5" filter="url(#card-shadow)"/>

  <!-- Cápsulas: PALAVRA na vertical (coluna 5) e CRUZADA na horizontal (linha 4),
       cruzando na letra A. -->
  <rect x="290" y="62" width="44" height="380" rx="22" fill="#F4C542"/>
  <rect x="66" y="230" width="380" height="44" rx="22" fill="#F4C542"/>

  <g class="letra">
    <!-- Linha 1 -->
    <text class="enchimento" x="88" y="84">M</text>
    <text class="enchimento" x="144" y="84">E</text>
    <text class="enchimento" x="200" y="84">T</text>
    <text class="enchimento" x="256" y="84">O</text>
    <text class="destaque" x="312" y="84">P</text>
    <text class="enchimento" x="368" y="84">I</text>
    <text class="enchimento" x="424" y="84">S</text>

    <!-- Linha 2 -->
    <text class="enchimento" x="88" y="140">A</text>
    <text class="enchimento" x="144" y="140">R</text>
    <text class="enchimento" x="200" y="140">I</text>
    <text class="enchimento" x="256" y="140">S</text>
    <text class="destaque" x="312" y="140">A</text>
    <text class="enchimento" x="368" y="140">O</text>
    <text class="enchimento" x="424" y="140">C</text>

    <!-- Linha 3 -->
    <text class="enchimento" x="88" y="196">S</text>
    <text class="enchimento" x="144" y="196">O</text>
    <text class="enchimento" x="200" y="196">A</text>
    <text class="enchimento" x="256" y="196">M</text>
    <text class="destaque" x="312" y="196">L</text>
    <text class="enchimento" x="368" y="196">E</text>
    <text class="enchimento" x="424" y="196">N</text>

    <!-- Linha 4 — CRUZADA -->
    <text class="destaque" x="88" y="252">C</text>
    <text class="destaque" x="144" y="252">R</text>
    <text class="destaque" x="200" y="252">U</text>
    <text class="destaque" x="256" y="252">Z</text>
    <text class="destaque" x="312" y="252">A</text>
    <text class="destaque" x="368" y="252">D</text>
    <text class="destaque" x="424" y="252">A</text>

    <!-- Linha 5 -->
    <text class="enchimento" x="88" y="308">T</text>
    <text class="enchimento" x="144" y="308">I</text>
    <text class="enchimento" x="200" y="308">E</text>
    <text class="enchimento" x="256" y="308">N</text>
    <text class="destaque" x="312" y="308">V</text>
    <text class="enchimento" x="368" y="308">A</text>
    <text class="enchimento" x="424" y="308">O</text>

    <!-- Linha 6 -->
    <text class="enchimento" x="88" y="364">O</text>
    <text class="enchimento" x="144" y="364">A</text>
    <text class="enchimento" x="200" y="364">S</text>
    <text class="enchimento" x="256" y="364">I</text>
    <text class="destaque" x="312" y="364">R</text>
    <text class="enchimento" x="368" y="364">M</text>
    <text class="enchimento" x="424" y="364">E</text>

    <!-- Linha 7 -->
    <text class="enchimento" x="88" y="420">N</text>
    <text class="enchimento" x="144" y="420">E</text>
    <text class="enchimento" x="200" y="420">O</text>
    <text class="enchimento" x="256" y="420">A</text>
    <text class="destaque" x="312" y="420">A</text>
    <text class="enchimento" x="368" y="420">S</text>
    <text class="enchimento" x="424" y="420">I</text>
  </g>
</svg>
