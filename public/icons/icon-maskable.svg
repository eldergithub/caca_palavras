<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;display=swap');
      .grid-letter {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #1E2A38;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .mini-letter {
        font-size: 33px;
        font-weight: 800;
      }
    </style>
  </defs>

  <!-- Fundo total para máscara adaptativa (Android PWA Maskable) -->
  <rect width="512" height="512" fill="#F8F5EC" />

  <!-- Conteúdo escalado para área segura circular de 80% (Safe Zone) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <!-- Cruz Amarela de Destaque (#F4C542) -->
    <rect x="227" y="60" width="58" height="384" rx="29" fill="#F4C542"/>
    <rect x="62" y="303" width="388" height="58" rx="29" fill="#F4C542"/>

    <!-- Grade de Letras (#1E2A38) -->
    <g class="grid-letter">
      <!-- Linha 1 -->
      <text x="100" y="104">A</text>
      <text x="178" y="104">B</text>
      <text x="256" y="104">C</text>
      <text x="334" y="104">D</text>
      <text x="412" y="104">E</text>

      <!-- Linha 2 -->
      <text x="100" y="178">F</text>
      <text x="178" y="178">G</text>
      <text x="256" y="178">H</text>
      <text x="334" y="178">I</text>
      <text x="412" y="178">J</text>

      <!-- Linha 3 -->
      <text x="100" y="252">K</text>
      <text x="178" y="252">L</text>
      <text x="256" y="252">M</text>
      <text x="334" y="252">N</text>
      <text x="412" y="252">O</text>

      <!-- Linha 4 (Destaque: PALAVRAS) -->
      <text x="100" y="331">P</text>
      <text x="146" y="331">A</text>
      <text x="190" y="331">L</text>
      <text x="241" y="331" class="mini-letter">A</text>
      <text x="271" y="331" class="mini-letter">V</text>
      <text x="322" y="331">R</text>
      <text x="366" y="331">A</text>
      <text x="412" y="331">S</text>

      <!-- Linha 5 -->
      <text x="100" y="405">U</text>
      <text x="178" y="405">V</text>
      <text x="256" y="405">W</text>
      <text x="334" y="405">X</text>
      <text x="412" y="405">Y</text>
    </g>
  </g>
</svg>
