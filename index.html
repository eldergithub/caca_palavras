<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9dd" />
    <meta name="description" content="Jogo de Caça-Palavras com alto contraste e acessibilidade tátil." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Caça-Palavras" />
    <title>Caça-Palavras</title>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
    <script>
      // Registro do Service Worker com recarga automática ao detectar atualização (§11.1)
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        let recarregando = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!recarregando) {
            recarregando = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then((reg) => {
              reg.update().catch(() => {});
            })
            .catch(() => {});
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then((reg) => {
              if (reg) reg.update().catch(() => {});
            });
          }
        });
      }
    </script>
  </body>
</html>
